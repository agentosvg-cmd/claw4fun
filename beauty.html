<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beauty Retouch</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101318;
        --panel: #191f27;
        --line: #313946;
        --text: #f4f6f8;
        --muted: #aab4c0;
        --accent: #34b27a;
        --danger: #ff6b6b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .phoneApp {
        width: min(100%, 720px);
        margin: 0 auto;
        padding: 18px;
      }

      .header {
        padding: 10px 2px 16px;
      }

      .eyebrow {
        margin: 0 0 6px;
        font-size: 13px;
      }

      .eyebrow a {
        color: var(--muted);
        text-decoration: none;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 30px;
        line-height: 1.1;
      }

      h2 {
        margin: 0;
        font-size: 16px;
      }

      .promptPanel,
      .resultPanel,
      .controlPanel {
        display: grid;
        gap: 14px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .controlPanel {
        padding: 14px;
        background: #131922;
      }

      .resultPanel {
        margin-top: 14px;
      }

      .panelHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      label {
        display: grid;
        gap: 7px;
        color: var(--muted);
        font-size: 13px;
      }

      textarea,
      input[type="password"],
      input[type="text"],
      select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 12px;
        background: #111720;
        color: var(--text);
        font: inherit;
        line-height: 1.45;
      }

      button {
        min-height: 48px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #06110b;
        font: inherit;
        font-weight: 800;
      }

      button:disabled {
        opacity: 0.65;
      }

      .smallButton {
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid var(--line);
        background: #243040;
        color: var(--text);
        font-size: 13px;
      }

      .photoButton {
        border: 1px solid var(--line);
        background: #243040;
        color: var(--text);
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .hiddenInput {
        display: none;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      .sub {
        font-size: 14px;
      }

      .hint {
        font-size: 12px;
      }

      .status.error {
        color: var(--danger);
      }

      img {
        width: 100%;
        border-radius: 8px;
        border: 1px solid var(--line);
      }

      .thumb {
        display: grid;
        gap: 8px;
      }

      .thumb img {
        max-height: 260px;
        object-fit: contain;
        background: #0b0f15;
      }

      .checkRow {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 14px;
      }

      .checkRow input {
        width: 22px;
        height: 22px;
        accent-color: var(--accent);
      }

      input[type="range"] {
        padding: 0;
      }

      .rangeValue {
        color: var(--text);
        font-weight: 700;
      }

      details summary {
        color: var(--muted);
        font-size: 13px;
        cursor: pointer;
      }

      details .controlGrid {
        display: grid;
        gap: 12px;
        padding-top: 12px;
      }

      .resultActions a {
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #243040;
        color: var(--text);
        text-decoration: none;
        font-weight: 800;
      }

      .presetButton {
        width: 100%;
        border: 1px solid var(--line);
        background: #243040;
        color: var(--text);
      }

      .galleryGrid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
      }

      .galleryItem {
        display: grid;
        gap: 3px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #111720;
        color: var(--text);
        overflow: hidden;
        text-align: left;
        cursor: pointer;
        -webkit-tap-highlight-color: rgba(52, 178, 122, 0.22);
      }

      .galleryItem img {
        aspect-ratio: 1;
        object-fit: cover;
        border: 0;
        border-radius: 0;
      }

      .galleryItem span {
        padding: 0 4px 5px;
        color: var(--muted);
        font-size: 10px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <main class="phoneApp">
      <section class="header">
        <p class="eyebrow"><a href="./">&larr; Fal Direct</a></p>
        <h1>Beauty Retouch</h1>
        <p class="sub">Take or pick a photo and retouch it. 4K upscale is optional.</p>
      </section>

      <form id="beautyForm" class="promptPanel">
        <label>
          Fal API key
          <input id="falKey" type="password" autocomplete="off" placeholder="Paste FAL_KEY here" />
        </label>

        <div class="actions">
          <button id="saveKeyButton" class="smallButton" type="button">Save key</button>
          <button id="resetPromptButton" class="smallButton" type="button">Reset prompt</button>
        </div>

        <label>
          Retouch prompt
          <textarea id="prompt" rows="7"></textarea>
        </label>

        <section class="controlPanel">
          <div class="panelHeader">
            <h2>Photo</h2>
            <button id="clearPhotoButton" class="smallButton" type="button" hidden>Remove</button>
          </div>

          <div class="actions">
            <button id="cameraButton" class="photoButton" type="button">Take photo</button>
            <button id="libraryButton" class="photoButton" type="button">Choose photo</button>
          </div>

          <input id="cameraInput" class="hiddenInput" type="file" accept="image/*" capture="environment" />
          <input id="libraryInput" class="hiddenInput" type="file" accept="image/*" />

          <div id="thumbWrap" class="thumb" hidden>
            <img id="thumb" alt="Selected photo" />
            <p id="photoName" class="hint"></p>
          </div>
        </section>

        <label>
          Megapixels <span id="megapixelsValue" class="rangeValue">0.5 MP</span>
          <input id="megapixels" type="range" min="0.5" max="4" step="0.5" value="0.5" />
        </label>

        <div class="checkRow">
          <input id="doUpscale" type="checkbox" />
          <label for="doUpscale">Upscale result to 4K</label>
        </div>

        <details>
          <summary>Advanced</summary>
          <div class="controlGrid">
            <label>
              Edit model
              <select id="editModel"></select>
            </label>

            <label>
              Config JSON
              <textarea id="config" rows="8" spellcheck="false"></textarea>
            </label>

            <label>
              Upscale endpoint
              <input id="upscaleEndpoint" type="text" spellcheck="false" value="fal-ai/seedvr/upscale/image" />
            </label>
          </div>
        </details>

        <button id="submitButton" type="submit">Retouch photo</button>
      </form>

      <section class="resultPanel">
        <p id="status" class="status">Ready. Paste your fal key once, then pick a photo.</p>
        <img id="preview" alt="" hidden />
        <div class="resultActions">
          <a id="imageLink" hidden target="_blank" rel="noopener">Open full image</a>
        </div>
        <p id="saveHint" class="hint" hidden>Long-press the image to save it to your photos.</p>
        <button id="upscaleNowButton" class="presetButton" type="button" hidden>Upscale to 4K</button>
      </section>

      <section class="resultPanel">
        <div class="panelHeader">
          <h2>Last 10 Photos</h2>
          <button id="clearGalleryButton" class="smallButton" type="button">Clear</button>
        </div>
        <div id="galleryGrid" class="galleryGrid" aria-live="polite"></div>
      </section>
    </main>

    <script>
      const STORAGE_KEY = "iphoneFalDirect.key";
      const HISTORY_KEY = "iphoneFalDirect.beautyHistory.v1";
      const HISTORY_LIMIT = 10;
      const REST_API = "https://rest.fal.ai";
      const QUEUE_API = "https://queue.fal.run";

      const defaultPrompt = [
        "Retouch this photo with natural, high-end beauty retouching.",
        "Even out and smooth the skin tone while keeping realistic skin texture and visible pores.",
        "Remove freckles, blemishes and spots. Remove under-eye bags and dark circles.",
        "Gently slim the face and body contour. Brighten and sharpen the eyes.",
        "Matte, non-oily skin finish. Remove shine and greasy highlights, no sweaty or oily look.",
        "Keep the identity, facial features, pose, clothing, lighting and background exactly the same.",
        "Photorealistic result. No plastic or over-smoothed skin, no airbrushed look."
      ].join(" ");

      const editModels = {
        "fal-ai/flux-2/edit": {
          label: "Flux 2 Dev Edit",
          imageField: "image_urls",
          supportsMegapixels: true,
          config: {
            num_images: 1,
            output_format: "png",
            sync_mode: false,
            enable_safety_checker: false
          }
        },
        "fal-ai/flux-2/klein/9b/edit": {
          label: "Flux 2 Klein 9B Edit",
          imageField: "image_urls",
          supportsMegapixels: true,
          config: {
            num_images: 1,
            output_format: "png",
            sync_mode: false,
            enable_safety_checker: false
          }
        },
        "ideogram/v4/image-to-image": {
          label: "Ideogram v4 Image to Image",
          imageField: "image_url",
          supportsMegapixels: false,
          config: {
            strength: 0.85,
            rendering_speed: "QUALITY",
            num_images: 1,
            sync_mode: false,
            enable_safety_checker: false,
            output_format: "png"
          }
        }
      };

      function snapToModelSize(value) {
        return Math.max(512, Math.round(value / 64) * 64);
      }

      function imageSizeForMegapixels(aspect, megapixels) {
        const pixels = megapixels * 1_000_000;
        const rawHeight = Math.sqrt(pixels / aspect);
        const rawWidth = rawHeight * aspect;
        return {
          width: snapToModelSize(rawWidth),
          height: snapToModelSize(rawHeight)
        };
      }

      const form = document.querySelector("#beautyForm");
      const falKeyInput = document.querySelector("#falKey");
      const saveKeyButton = document.querySelector("#saveKeyButton");
      const resetPromptButton = document.querySelector("#resetPromptButton");
      const promptInput = document.querySelector("#prompt");
      const cameraButton = document.querySelector("#cameraButton");
      const libraryButton = document.querySelector("#libraryButton");
      const cameraInput = document.querySelector("#cameraInput");
      const libraryInput = document.querySelector("#libraryInput");
      const clearPhotoButton = document.querySelector("#clearPhotoButton");
      const thumbWrap = document.querySelector("#thumbWrap");
      const thumb = document.querySelector("#thumb");
      const photoName = document.querySelector("#photoName");
      const doUpscale = document.querySelector("#doUpscale");
      const megapixelsInput = document.querySelector("#megapixels");
      const megapixelsValue = document.querySelector("#megapixelsValue");
      const editModel = document.querySelector("#editModel");
      const configInput = document.querySelector("#config");
      const upscaleEndpoint = document.querySelector("#upscaleEndpoint");
      const submitButton = document.querySelector("#submitButton");
      const statusEl = document.querySelector("#status");
      const preview = document.querySelector("#preview");
      const imageLink = document.querySelector("#imageLink");
      const saveHint = document.querySelector("#saveHint");
      const upscaleNowButton = document.querySelector("#upscaleNowButton");
      const galleryGrid = document.querySelector("#galleryGrid");
      const clearGalleryButton = document.querySelector("#clearGalleryButton");

      let selectedFile = null;
      let thumbUrl = "";
      let photoAspect = 1;
      let currentImageUrl = "";

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.classList.toggle("error", isError);
      }

      function authHeaders() {
        const key = falKeyInput.value.trim();
        if (!key) throw new Error("Paste your fal key first.");
        return {
          Authorization: `Key ${key}`,
          Accept: "application/json",
          "Content-Type": "application/json"
        };
      }

      async function falJson(url, options = {}) {
        const response = await fetch(url, {
          ...options,
          headers: {
            ...authHeaders(),
            ...(options.headers || {})
          }
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.detail || data.message || data.error || `fal HTTP ${response.status}`);
        }
        return data;
      }

      async function uploadFile(file) {
        const initiate = await falJson(`${REST_API}/storage/upload/initiate?storage_type=fal-cdn-v3`, {
          method: "POST",
          body: JSON.stringify({
            content_type: file.type || "application/octet-stream",
            file_name: file.name || `photo-${Date.now()}.jpg`
          })
        });

        const uploadResponse = await fetch(initiate.upload_url, {
          method: "PUT",
          body: file,
          headers: {
            "Content-Type": file.type || "application/octet-stream"
          }
        });
        if (!uploadResponse.ok) throw new Error(`Upload failed: ${uploadResponse.status}`);
        return initiate.file_url;
      }

      async function waitForQueue(queued, label) {
        const statusUrl = queued.status_url || queued.statusUrl;
        if (!statusUrl) throw new Error("fal did not return a status URL.");

        for (let attempt = 0; attempt < 240; attempt += 1) {
          const url = new URL(statusUrl);
          url.searchParams.set("logs", "1");
          const status = await falJson(url.toString(), { method: "GET" });
          if (status.status === "COMPLETED") return;
          if (status.status === "FAILED") throw new Error(status.error || `${label} failed.`);
          const queuePosition = status.queue_position ?? status.position;
          if (status.status === "IN_QUEUE" && Number.isFinite(queuePosition)) {
            setStatus(`${label}: queued, position ${queuePosition}...`);
          } else {
            setStatus(`${label}...`);
          }
          await new Promise((resolve) => setTimeout(resolve, 1200));
        }
        throw new Error(`Timed out waiting for ${label}.`);
      }

      async function runFal(endpointId, input, label) {
        const queued = await falJson(`${QUEUE_API}/${endpointId}`, {
          method: "POST",
          body: JSON.stringify(input)
        });
        const responseUrl = queued.response_url || queued.responseUrl;
        if (!responseUrl) throw new Error("fal did not return a response URL.");
        setStatus(`${label}...`);
        await waitForQueue(queued, label);
        return falJson(responseUrl, { method: "GET" });
      }

      function collectMedia(result) {
        const data = result?.data || result;
        const candidates = [
          data?.image,
          ...(Array.isArray(data?.images) ? data.images : []),
          ...(Array.isArray(data?.data?.images) ? data.data.images : [])
        ].filter(Boolean);
        return candidates
          .map((item) => (typeof item === "string" ? { url: item } : item))
          .filter((item) => item?.url);
      }

      function firstImageUrl(result, label) {
        const images = collectMedia(result);
        if (!images.length) throw new Error(`${label} returned no image URL.`);
        return images[0].url;
      }

      function showResult(url) {
        currentImageUrl = url;
        preview.src = url;
        preview.hidden = false;
        imageLink.href = url;
        imageLink.hidden = false;
        saveHint.hidden = false;
        upscaleNowButton.hidden = false;
      }

      function loadHistory() {
        try {
          const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
          return Array.isArray(history) ? history : [];
        } catch {
          return [];
        }
      }

      function saveHistory(history) {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, HISTORY_LIMIT)));
        renderGallery();
      }

      function addHistoryEntry(entry) {
        saveHistory([
          {
            id: crypto.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`,
            createdAt: new Date().toISOString(),
            ...entry
          },
          ...loadHistory()
        ]);
      }

      function galleryLabel(entry) {
        const date = new Date(entry.createdAt);
        if (Number.isNaN(date.getTime())) return "Saved";
        return date.toLocaleString([], {
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      function restoreEntry(entry) {
        if (!entry.url) return;
        showResult(entry.url);
        setStatus(`Loaded from history: ${entry.model || "fal"}`);
      }

      function renderGallery() {
        const history = loadHistory();
        galleryGrid.textContent = "";
        if (!history.length) {
          galleryGrid.textContent = "No generated history yet.";
          return;
        }
        for (const entry of history) {
          if (!entry.url) continue;
          const item = document.createElement("article");
          item.className = "galleryItem";
          item.tabIndex = 0;
          item.setAttribute("role", "button");

          const image = document.createElement("img");
          image.src = entry.url;
          image.alt = "";
          image.loading = "lazy";

          const label = document.createElement("span");
          label.textContent = `${galleryLabel(entry)} | ${entry.model || "fal"}`;

          const restore = () => restoreEntry(entry);
          item.append(image, label);
          item.addEventListener("click", restore);
          item.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              restore();
            }
          });
          galleryGrid.append(item);
        }
      }

      function setPhoto(file) {
        if (!file) return;
        selectedFile = file;
        if (thumbUrl) URL.revokeObjectURL(thumbUrl);
        thumbUrl = URL.createObjectURL(file);
        thumb.src = thumbUrl;
        thumbWrap.hidden = false;
        clearPhotoButton.hidden = false;
        photoName.textContent = file.name || "Photo ready";
        setStatus("Photo ready. Tap Retouch photo.");

        const probe = new Image();
        probe.onload = () => {
          if (probe.naturalWidth && probe.naturalHeight) {
            photoAspect = probe.naturalWidth / probe.naturalHeight;
            setConfigForModel();
          }
        };
        probe.src = thumbUrl;
      }

      function clearPhoto() {
        selectedFile = null;
        if (thumbUrl) URL.revokeObjectURL(thumbUrl);
        thumbUrl = "";
        thumb.removeAttribute("src");
        thumbWrap.hidden = true;
        clearPhotoButton.hidden = true;
        cameraInput.value = "";
        libraryInput.value = "";
        setStatus("Photo removed.");
      }

      async function retouch() {
        if (!selectedFile) {
          setStatus("Take or choose a photo first.", true);
          return;
        }
        const prompt = promptInput.value.trim();
        if (!prompt) {
          setStatus("Write a retouch prompt first.", true);
          return;
        }

        submitButton.disabled = true;
        preview.hidden = true;
        imageLink.hidden = true;
        saveHint.hidden = true;

        try {
          localStorage.setItem(STORAGE_KEY, falKeyInput.value.trim());

          setStatus("Uploading photo...");
          const photoUrl = await uploadFile(selectedFile);

          const endpointId = editModel.value;
          const input = JSON.parse(configInput.value || "{}");
          input.prompt = prompt;
          const imageField = editModels[endpointId]?.imageField || "image_urls";
          input[imageField] = imageField === "image_urls" ? [photoUrl] : photoUrl;

          const editResult = await runFal(endpointId, input, "Retouching");
          let finalUrl = firstImageUrl(editResult, "Retouch");
          let usedModel = endpointId;

          if (doUpscale.checked) {
            const upscaleResult = await runFal(
              upscaleEndpoint.value.trim(),
              {
                image_url: finalUrl,
                upscale_mode: "target",
                target_resolution: "2160p",
                noise_scale: 0.1,
                output_format: "png",
                sync_mode: false
              },
              "Upscaling to 4K"
            );
            finalUrl = firstImageUrl(upscaleResult, "Upscale");
            usedModel = upscaleEndpoint.value.trim();
          }

          showResult(finalUrl);
          addHistoryEntry({ model: usedModel, prompt, url: finalUrl });
          setStatus(doUpscale.checked ? "Done. Retouched and upscaled to 4K." : "Done. Retouched.");
        } catch (error) {
          setStatus(error.message, true);
        } finally {
          submitButton.disabled = false;
        }
      }

      async function upscaleCurrentImage() {
        if (!currentImageUrl) {
          setStatus("Generate or choose a photo from history first.", true);
          return;
        }

        submitButton.disabled = true;
        upscaleNowButton.disabled = true;
        setStatus("Upscaling to 4K...");

        try {
          const endpointId = upscaleEndpoint.value.trim();
          const upscaleResult = await runFal(
            endpointId,
            {
              image_url: currentImageUrl,
              upscale_mode: "target",
              target_resolution: "2160p",
              noise_scale: 0.1,
              output_format: "png",
              sync_mode: false
            },
            "Upscaling to 4K"
          );
          const finalUrl = firstImageUrl(upscaleResult, "Upscale");
          showResult(finalUrl);
          addHistoryEntry({ model: endpointId, prompt: "4K upscale", url: finalUrl });
          setStatus("Done. Upscaled to 4K.");
        } catch (error) {
          setStatus(error.message, true);
        } finally {
          submitButton.disabled = false;
          upscaleNowButton.disabled = false;
        }
      }

      function setConfigForModel() {
        const model = editModels[editModel.value];
        const nextConfig = { ...(model?.config || {}) };
        if (model?.supportsMegapixels) {
          nextConfig.image_size = imageSizeForMegapixels(photoAspect, Number(megapixelsInput.value));
        }
        configInput.value = JSON.stringify(nextConfig, null, 2);
      }

      function updateMegapixelsLabel() {
        megapixelsValue.textContent = `${Number(megapixelsInput.value).toFixed(1)} MP`;
      }

      for (const [id, model] of Object.entries(editModels)) {
        const option = document.createElement("option");
        option.value = id;
        option.textContent = model.label;
        editModel.append(option);
      }

      falKeyInput.value = localStorage.getItem(STORAGE_KEY) || "";
      promptInput.value = defaultPrompt;
      updateMegapixelsLabel();
      setConfigForModel();
      renderGallery();

      editModel.addEventListener("change", setConfigForModel);
      megapixelsInput.addEventListener("input", () => {
        updateMegapixelsLabel();
        setConfigForModel();
      });

      saveKeyButton.addEventListener("click", () => {
        localStorage.setItem(STORAGE_KEY, falKeyInput.value.trim());
        setStatus("Key saved on this browser.");
      });

      resetPromptButton.addEventListener("click", () => {
        promptInput.value = defaultPrompt;
        setStatus("Prompt reset to default.");
      });

      cameraButton.addEventListener("click", () => cameraInput.click());
      libraryButton.addEventListener("click", () => libraryInput.click());
      cameraInput.addEventListener("change", () => setPhoto(cameraInput.files?.[0]));
      libraryInput.addEventListener("change", () => setPhoto(libraryInput.files?.[0]));
      clearPhotoButton.addEventListener("click", clearPhoto);

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        retouch();
      });

      upscaleNowButton.addEventListener("click", upscaleCurrentImage);
      clearGalleryButton.addEventListener("click", () => {
        localStorage.removeItem(HISTORY_KEY);
        renderGallery();
        setStatus("History cleared.");
      });
    </script>
  </body>
</html>
