<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fal Direct</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101318;
        --panel: #191f27;
        --line: #313946;
        --text: #f4f6f8;
        --muted: #aab4c0;
        --accent: #34b27a;
        --danger: #ff6b6b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .phoneApp {
        width: min(100%, 720px);
        margin: 0 auto;
        padding: 18px;
      }

      .header {
        padding: 10px 2px 16px;
      }

      .eyebrow {
        margin: 0 0 6px;
        color: var(--muted);
        font-size: 13px;
      }

      h1 {
        margin: 0;
        font-size: 30px;
        line-height: 1.1;
      }

      h2 {
        margin: 0;
        font-size: 16px;
      }

      .promptPanel,
      .resultPanel,
      .controlPanel {
        display: grid;
        gap: 14px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .controlPanel {
        padding: 14px;
        background: #131922;
      }

      .resultPanel {
        margin-top: 14px;
      }

      .panelHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .controlGrid {
        display: grid;
        gap: 12px;
      }

      .presetRow {
        display: flex;
      }

      label {
        display: grid;
        gap: 7px;
        color: var(--muted);
        font-size: 13px;
      }

      textarea,
      input,
      select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 12px;
        background: #111720;
        color: var(--text);
        font: inherit;
        line-height: 1.45;
      }

      input[type="range"] {
        padding: 0;
      }

      button {
        min-height: 48px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #06110b;
        font: inherit;
        font-weight: 800;
      }

      button:disabled {
        opacity: 0.65;
      }

      .smallButton {
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid var(--line);
        background: #243040;
        color: var(--text);
        font-size: 13px;
      }

      .presetButton {
        width: 100%;
        border: 1px solid var(--line);
        background: #243040;
        color: var(--text);
      }

      .rangeValue {
        color: var(--text);
        font-weight: 700;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      .status.error {
        color: var(--danger);
      }

      img,
      video {
        width: 100%;
        max-width: 100%;
        border-radius: 8px;
        border: 1px solid var(--line);
      }

      a {
        color: #8bd8ff;
      }

      .resultActions,
      .mediaActions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .resultActions a,
      .resultActions button {
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #243040;
        color: var(--text);
        text-decoration: none;
        font-weight: 800;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .galleryGrid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
      }

      .galleryItem {
        display: grid;
        gap: 3px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #111720;
        color: var(--text);
        overflow: hidden;
        text-align: left;
        cursor: pointer;
        -webkit-tap-highlight-color: rgba(52, 178, 122, 0.22);
      }

      .galleryItem img,
      .galleryItem video {
        aspect-ratio: 1;
        object-fit: cover;
        border: 0;
        border-radius: 0;
      }

      .galleryItem span {
        padding: 0 4px 5px;
        color: var(--muted);
        font-size: 10px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.classList.toggle("error", isError);
      }

      function authHeaders() {
        const key = falKeyInput.value.trim();
        if (!key) throw new Error("Paste your fal key first.");
        return {
          Authorization: `Key ${key}`,
          Accept: "application/json",
          "Content-Type": "application/json"
        };
      }

      async function falJson(url, options = {}) {
        const response = await fetch(url, {
          ...options,
          headers: {
            ...authHeaders(),
            ...(options.headers || {})
          }
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.detail || data.message || data.error || `fal HTTP ${response.status}`);
        }
        return data;
      }

      async function uploadFile(file) {
        const initiate = await falJson(`${REST_API}/storage/upload/initiate?storage_type=fal-cdn-v3`, {
          method: "POST",
          body: JSON.stringify({
            content_type: file.type || "application/octet-stream",
            file_name: file.name || `iphone-upload-${Date.now()}`
          })
        });

        const uploadResponse = await fetch(initiate.upload_url, {
          method: "PUT",
          body: file,
          headers: {
            "Content-Type": file.type || "application/octet-stream"
          }
        });
        if (!uploadResponse.ok) throw new Error(`Upload failed: ${uploadResponse.status}`);
        return initiate.file_url;
      }

      async function submitQueue(endpointId, input) {

        const requestId = queued.request_id || queued.requestId;
        const statusUrl = queued.status_url || queued.statusUrl;
        if (!statusUrl) throw new Error("fal did not return a status URL.");

        for (let attempt = 0; attempt < 240; attempt += 1) {
          const url = new URL(statusUrl);
          url.searchParams.set("logs", "1");
          const status = await falJson(url.toString(), {
            method: "GET"
          });
          if (status.status === "COMPLETED") return;
          if (status.status === "FAILED") throw new Error(status.error || "fal generation failed.");
          const queuePosition = status.queue_position ?? status.position;
          if (status.status === "IN_QUEUE" && Number.isFinite(queuePosition)) {
            setStatus(`Queued. Position ${queuePosition}...`);
          } else {
            setStatus(`Generating... ${status.status || "working"}`);
          }
          await new Promise((resolve) => setTimeout(resolve, 1200));
        }
        throw new Error("Timed out waiting for fal.");
      }

      async function runFal(endpointId, input) {
        const queued = await submitQueue(endpointId, input);
        const requestId = queued.request_id || queued.requestId;
        if (!requestId) throw new Error("fal did not return a request id.");
        const responseUrl = queued.response_url || queued.responseUrl;
        if (!responseUrl) throw new Error("fal did not return a response URL.");
        setStatus(`Queued: ${requestId}`);
        await waitForQueue(queued);
        return falJson(responseUrl, { method: "GET" });
      }

      function collectMedia(result) {
        const data = result?.data || result;
        const candidates = [
          data?.image,
          ...(Array.isArray(data?.images) ? data.images : []),
          ...(Array.isArray(data?.data?.images) ? data.data.images : [])
        ].filter(Boolean);
        return candidates
          .map((item) => (typeof item === "string" ? { url: item } : item))
          .filter((item) => item?.url);
      }

      function collectVideoUrl(result) {
        const data = result?.data || result;
        const video = data?.video || data?.data?.video;
        return typeof video === "string" ? video : video?.url || "";
      }

      function selectedLoras() {
        return loraControls
          .map((control) => ({
            key: control.select.value,
            scale: Number(control.strength.value) / 100
          }))
          .filter((entry) => entry.key !== "none")
          .map((entry) => ({ ...entry, ...loraPresets[entry.key] }))
          .filter((entry) => entry.path);
      }

      function selectedLoraFamily() {
        return selectedLoras()[0]?.family || null;
      }

      function hasLoraFamilyConflict() {
        return new Set(selectedLoras().map((entry) => entry.family)).size > 1;
      }

      function selectedModel() {
        const family = selectedLoraFamily();
        if (family === "ideogram4") return "ideogram/v4/lora";
        if (family === "krea2") return "fal-ai/krea-2/turbo/lora";
        if (family === "flux2_klein") return "fal-ai/flux-2/klein/9b/lora";
        return modelInput.value;
      }

      function baseConfigForLoraFamily(family) {
        if (family === "ideogram4") return { ...defaultConfig };
        if (family === "krea2") return { ...krea2Config };
        if (family === "flux2_klein") return { ...flux2KleinConfig };
        return null;
      }

      function isKreaV2Model(model) {
        return model.startsWith("krea/v2/");
      }

      function aspectForResolution(resolution) {
        if (resolution === "portrait_16_9") return 9 / 16;
        if (resolution === "portrait_4_3") return 3 / 4;
        if (resolution === "landscape_16_9") return 16 / 9;
        if (resolution === "landscape_4_3") return 4 / 3;
        return 1;
      }

      function kreaAspectForResolution(resolution) {
        if (resolution === "portrait_16_9") return "9:16";
        if (resolution === "portrait_4_3") return "2:3";
        if (resolution === "landscape_16_9") return "16:9";
        if (resolution === "landscape_4_3") return "4:3";
        return "1:1";
      }

      function snapToModelSize(value) {
        return Math.max(512, Math.round(value / 64) * 64);
      }

      function imageSizeForMegapixels(resolution, megapixels) {
        const aspect = aspectForResolution(resolution);
        const pixels = megapixels * 1_000_000;
        const rawHeight = Math.sqrt(pixels / aspect);
        const rawWidth = rawHeight * aspect;
        return {
          width: snapToModelSize(rawWidth),
          height: snapToModelSize(rawHeight)
        };
      }

      function applyResolution(config) {
        const endpointId = selectedModel();
        const resolution = resolutionInput.value;
        const megapixels = Number(megapixelsInput.value);

        if (isKreaV2Model(endpointId)) {
          const nextConfig = { ...config };
          if (resolution === "model_default") {
            delete nextConfig.aspect_ratio;
            return nextConfig;
          }
          nextConfig.aspect_ratio = kreaAspectForResolution(resolution);
          return nextConfig;
        }

        if (!megapixels) {
          delete config.image_size;
          return config;
        }
        return {
          ...config,
          image_size: imageSizeForMegapixels(resolution, megapixels)
        };
      }

      function setConfigForModel() {
        let nextConfig;
        const loras = selectedLoras();
        if (loras.length) {
          const family = selectedLoraFamily();
          nextConfig = baseConfigForLoraFamily(family);
          nextConfig.loras = loras
            .filter((entry) => entry.family === family)
            .map((entry) => ({ path: entry.path, scale: entry.scale }));
        } else if (modelInput.value.includes("/edit")) {
          nextConfig = { ...editConfig };
        } else if (modelInput.value === "fal-ai/krea-2/turbo") {
          nextConfig = { ...krea2Config };
        } else if (modelInput.value === "fal-ai/flux/dev") {
          nextConfig = { ...fluxDevConfig };
        } else if (modelInput.value === "fal-ai/flux-2/klein/9b") {
          nextConfig = { ...flux2KleinConfig };
        } else if (isKreaV2Model(modelInput.value)) {
          nextConfig = { ...krea2FullConfig };
        } else {
          nextConfig = { ...defaultConfig };
        }
        configInput.value = JSON.stringify(applyResolution(nextConfig), null, 2);
      }

      function formatAperture() {
        const value = Number(apertureInput.value) / 10;
        return Number.isInteger(value) ? `f/${value.toFixed(0)}` : `f/${value.toFixed(1)}`;
      }

      function formatExposure() {
        const value = Number(exposureInput.value) / 10;
        if (value === 0) return "0 EV";
        return `${value > 0 ? "+" : ""}${value.toFixed(1)} EV`;
      }

      function lensDescription(mm) {
        if (mm <= 24) return "ultra wide-angle lens";
        if (mm <= 35) return "wide-angle lens";
        if (mm <= 70) return "natural portrait lens";
        if (mm <= 135) return "short telephoto portrait lens";
        if (mm <= 300) return "telephoto lens with compression";
        return "super telephoto lens with strong compression";
      }

      function apertureDescription(value) {
        if (value <= 10) return "extreme shallow depth of field with dreamy blur";
        if (value <= 28) return "very shallow depth of field";
        if (value <= 56) return "shallow depth of field";
        if (value <= 110) return "moderate depth of field";
        return "deep depth of field";
      }

      function cameraHeightDescription(cm) {
        if (cm <= 20) return "floor-level low angle";
        if (cm <= 60) return "low handheld angle";
        if (cm <= 110) return "waist-height camera angle";
        if (cm <= 160) return "chest-to-eye-level camera angle";
        return "high camera angle approaching top view";
      }

      function exposureDescription(value) {
        if (value <= -20) return "intentionally darker underexposed image";
        if (value <= -6) return "slightly darker exposure";
        if (value <= 5) return "neutral balanced exposure";
        if (value <= 19) return "slightly brighter exposure";
        return "bright high-key exposure";
      }

      function clothingThicknessDescription(value) {
        if (value <= 20) return "light fabric clothing, still fully clothed";
        if (value <= 45) return "medium-light fabric clothing, fully clothed";
        if (value <= 70) return "medium fabric clothing, fully clothed";
        if (value <= 90) return "thick fabric clothing, fully clothed";
        return "heavy layered clothing, fully clothed";
      }

      function cameraControlPrompt() {
        const apertureRaw = Number(apertureInput.value);
        const aperture = formatAperture();
        const focalLength = Number(focalLengthInput.value);
        const focusPoint = focusPointInput.value;
        const cameraHeight = Number(cameraHeightInput.value);
        const exposureRaw = Number(exposureInput.value);
        const exposure = formatExposure();
        const clothingThickness = Number(clothingThicknessInput.value);

        return [
          `Camera controls: ${aperture} aperture, ${apertureDescription(apertureRaw)}, ${focalLength}mm ${lensDescription(focalLength)}.`,
          `Focus point: sharp focus on the ${focusPoint}.`,
          `Camera height: ${cameraHeight}cm from the floor, ${cameraHeightDescription(cameraHeight)}.`,
          `Camera exposure: ${exposure}, ${exposureDescription(exposureRaw)}.`,
          `Clothing thickness: ${clothingThickness}/100, ${clothingThicknessDescription(clothingThickness)}.`
        ].join(" ");
      }

      function enhancedPrompt() {
        return `${promptInput.value.trim()}\n\n${cameraControlPrompt()}`.trim();
      }

      function updateControlLabels() {
        apertureValue.textContent = formatAperture();
        focalLengthValue.textContent = `${focalLengthInput.value}mm`;
        cameraHeightValue.textContent = `${cameraHeightInput.value}cm`;
        exposureValue.textContent = formatExposure();
        clothingThicknessValue.textContent = `${clothingThicknessInput.value}%`;
        megapixelsValue.textContent = `${Number(megapixelsInput.value).toFixed(1)} MP`;
        for (const control of loraControls) {
          control.value.textContent = (Number(control.strength.value) / 100).toFixed(2);
        }
      }

      function loadHistory() {
        try {
          const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
          return Array.isArray(history) ? history : [];
        } catch {
          return [];
        }
      }

      function saveHistory(history) {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, HISTORY_LIMIT)));
        renderGallery();
      }

      function addHistoryEntry(entry) {
        saveHistory([
          {
            id: crypto.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`,
            createdAt: new Date().toISOString(),
            ...entry
          },
          ...loadHistory()

      function galleryLabel(entry) {
        const date = new Date(entry.createdAt);
        if (Number.isNaN(date.getTime())) return "Saved";
        return date.toLocaleString([], {
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      function firstHistoryImage(entry) {
        const image = entry.images?.find((item) => item?.url);
        return image?.url || "";
      }

      function firstHistoryVideo(entry) {
        const video = entry.videos?.find((item) => item?.url);
        return video?.url || "";
      }

      function restoreEntry(entry) {
        const videoUrl = firstHistoryVideo(entry);
        if (videoUrl) {
          if (entry.sourceImageUrl) showImage(entry.sourceImageUrl);
          showVideo(videoUrl);
          setStatus(`Loaded video from history: ${entry.model || "fal"}`);
          return;
        }

        const imageUrl = firstHistoryImage(entry);
        if (!imageUrl) return;
        showImage(imageUrl);
        setStatus(`Loaded image from history: ${entry.model || "fal"}`);
      }

      function renderGallery() {
        const history = loadHistory();
        galleryGrid.textContent = "";
        if (!history.length) {
          galleryGrid.textContent = "No generated media yet.";
          return;
        }
        for (const entry of history) {
          const videoUrl = firstHistoryVideo(entry);
          const imageUrl = firstHistoryImage(entry);
          if (!videoUrl && !imageUrl) continue;
          const item = document.createElement("article");
          item.className = "galleryItem";
          item.tabIndex = 0;
          item.setAttribute("role", "button");

          let media;
          if (videoUrl) {
            media = document.createElement("video");
            media.src = videoUrl;
            media.muted = true;
            media.playsInline = true;
            media.preload = "metadata";
            if (entry.sourceImageUrl) media.poster = entry.sourceImageUrl;
          } else {
            media = document.createElement("img");
            media.src = imageUrl;
            media.alt = "";
            media.loading = "lazy";
          }

          const label = document.createElement("span");
          const mediaType = videoUrl ? "Video" : "Image";
          label.textContent = `${mediaType} | ${galleryLabel(entry)}`;

          const restore = () => restoreEntry(entry);
          item.append(media, label);
          item.addEventListener("click", restore);
          item.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              restore();
            }
          });
          galleryGrid.append(item);
        }
      }

      function buildLoraControls() {
        const options = Object.entries(loraPresets)
          .map(([key, preset]) => `<option value="${key}">${preset.label}</option>`)
          .join("");
        for (let index = 1; index <= 8; index += 1) {
          const loraLabel = document.createElement("label");
          loraLabel.textContent = `LoRA ${index}`;
          const select = document.createElement("select");
          select.innerHTML = options;
          loraLabel.append(select);

          const strengthLabel = document.createElement("label");
          strengthLabel.innerHTML = `LoRA ${index} strength <span class="rangeValue">1.00</span>`;
          const strength = document.createElement("input");
          strength.type = "range";
          strength.min = "0";
          strength.max = "150";
          strength.step = "5";
          strength.value = "100";
          strengthLabel.append(strength);

          const value = strengthLabel.querySelector(".rangeValue");
          loraControls.push({ select, strength, value, autoInsertedTrigger: "", selectedKey: "none" });
          loraGrid.append(loraLabel, strengthLabel);
        }
      }

      function escapeRegExp(value) {
        return value.replace(/[.*+?^${}()|[\]\\]/g, "\\      function applyLoraSelection(control) {
        const preset = loraPresets[control.select.value];
        if (Number.isFinite(preset?.defaultScale)) {
          control.strength.value = String(preset.defaultScale * 100);
        }

        if (preset?.triggerWord) {
          const triggerPattern = new RegExp(`(^|[\\s,])${preset.triggerWord}(?=$|[\\s,])`, "i");
          const existing = promptInput.value.trim();
          if (!triggerPattern.test(existing)) {
            promptInput.value = existing ? `${preset.triggerWord}, ${existing}` : preset.triggerWord;
          }
          setStatus(`${preset.label} selected. Trigger word added to prompt.`);
        }

        updateControlLabels();
        setConfigForModel();
      }");
      }

      function triggerPattern(triggerWord) {
        return new RegExp(`(^|[\\s,])${escapeRegExp(triggerWord)}(?=$|[\\s,])`, "i");
      }

      function removeAutoInsertedTrigger(control) {
        const triggerWord = control.autoInsertedTrigger;
        if (!triggerWord) return;

        promptInput.value = promptInput.value
          .replace(triggerPattern(triggerWord), (match, prefix, offset) => {
            if (offset === 0) return "";
            return prefix.includes(",") ? ", " : " ";
          })
          .replace(/^\s*,\s*/, "")
          .replace(/,\s*,+/g, ", ")
          .replace(/,\s*$/, "")
          .replace(/\s{2,}/g, " ")
          .trim();
        control.autoInsertedTrigger = "";
      }

      function applyLoraSelection(control) {
        const selectedKey = control.select.value;
        const preset = loraPresets[selectedKey];

        if (control.selectedKey !== selectedKey) {
          removeAutoInsertedTrigger(control);
        }

        if (Number.isFinite(preset?.defaultScale)) {
          control.strength.value = String(preset.defaultScale * 100);
        }

        if (preset?.triggerWord) {
          const existing = promptInput.value.trim();
          if (!triggerPattern(preset.triggerWord).test(existing)) {
            promptInput.value = existing ? `${preset.triggerWord}, ${existing}` : preset.triggerWord;
            control.autoInsertedTrigger = preset.triggerWord;
          }
          setStatus(`${preset.label} selected. Trigger word added to prompt.`);
        }

        control.selectedKey = selectedKey;
        updateControlLabels();
        setConfigForModel();
      }

      async function buildInput() {
        if (hasLoraFamilyConflict()) {
          throw new Error("All selected LoRAs must be from the same model family.");
        }

        const input = JSON.parse(configInput.value || "{}");
        const prompt = enhancedPrompt();
        if (!prompt) throw new Error("Write a prompt first.");
        input.prompt = prompt;

        const endpointId = selectedModel();
        const file = referenceInput.files?.[0];
        if (file) {
          setStatus("Uploading reference image...");
          const referenceUrl = await uploadFile(file);
          if (isKreaV2Model(endpointId)) {
            input.image_style_references = [{ image_url: referenceUrl, strength: 1 }];
          } else if (endpointId.includes("seedvr")) {
            input.image_url = referenceUrl;
          } else {
            input.image_urls = [referenceUrl];
          }
        }

        return { endpointId, input, prompt };
      }

      async function generateImage() {
        submitButton.disabled = true;
        upscaleButton.disabled = true;
        preview.hidden = true;
        imageLink.hidden = true;
        saveLink.hidden = true;
        currentImageUrl = "";
        setStatus("Generating...");

        try {
          localStorage.setItem(STORAGE_KEY, falKeyInput.value.trim());
          setConfigForModel();
          const { endpointId, input, prompt } = await buildInput();
          const result = await runFal(endpointId, input);
          const images = collectMedia(result);
          if (!images.length) throw new Error("fal returned no image URL.");

          showImage(images[0].url);
          addHistoryEntry({
            model: endpointId,
            prompt,
            images
          });
          setStatus(`Done. ${images.length} image${images.length === 1 ? "" : "s"} returned.`);
        } catch (error) {
          setStatus(error.message, true);
        } finally {
          submitButton.disabled = false;
          upscaleButton.disabled = false;
        }
      }

      async function generateVideo() {
        const uploadedFile = videoSourceInput.files?.[0];
        if (!uploadedFile && !currentImageUrl) {
          setStatus("Upload an image or generate one first.", true);
          return;
        }

        const prompt = videoPromptInput.value.trim() || "Subtle natural motion, camera holds steady.";
        const originalLabel = videoButton.textContent;
        submitButton.disabled = true;
        upscaleButton.disabled = true;
        videoButton.disabled = true;
        videoButton.textContent = "Generating video… ($0.25)";

        try {
          localStorage.setItem(STORAGE_KEY, falKeyInput.value.trim());
          let sourceImageUrl = currentImageUrl;
          if (uploadedFile) {
            setStatus("Uploading image for video...");
            sourceImageUrl = await uploadFile(uploadedFile);
            showImage(sourceImageUrl);
          }

          setStatus("Generating 5-second video with MiniMax H3...");
          const endpointId = "minimax/h3/image-to-video";
          const result = await runFal(endpointId, {
            prompt,
            image_url: sourceImageUrl,
            duration: 5,
            resolution: "480P",
            prompt_expansion_mode: "fast",
            enable_safety_checker: false
          });
          const videoUrl = collectVideoUrl(result);
          if (!videoUrl) throw new Error("MiniMax H3 returned no video URL.");

          showVideo(videoUrl);
          addHistoryEntry({
            model: endpointId,
            prompt,
            sourceImageUrl,
            videos: [{ url: videoUrl }]
          });
          setStatus("Done. 5-second video generated and saved to media history.");
        } catch (error) {
          setStatus(error.message, true);
        } finally {
          submitButton.disabled = false;
          upscaleButton.disabled = false;
          videoButton.disabled = false;
          videoButton.textContent = originalLabel;
        }
      }

      async function downloadCurrentVideo() {
        if (!currentVideoUrl) {
          setStatus("Generate or choose a video first.", true);
          return;
        }

        const originalLabel = videoDownloadButton.textContent;
        videoDownloadButton.disabled = true;
        videoDownloadButton.textContent = "Downloading…";

        try {
          const response = await fetch(currentVideoUrl);
          if (!response.ok) throw new Error(`Download failed (${response.status}).`);
          const blob = await response.blob();
          const blobUrl = URL.createObjectURL(blob);
          const downloadLink = document.createElement("a");
          downloadLink.href = blobUrl;
          downloadLink.download = `fal-video-${Date.now()}.mp4`;
          document.body.append(downloadLink);
          downloadLink.click();
          downloadLink.remove();
          setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
          setStatus("Video download started.");
        } catch (error) {
          setStatus(`${error.message} Use Open video, then Share or Save to Files.`, true);
        } finally {
          videoDownloadButton.disabled = false;
          videoDownloadButton.textContent = originalLabel;
        }
      }

      form.addEventListener("submit", (event) => {

        generateImage();
      });
      upscaleButton.addEventListener("click", upscaleCurrentImage);
      videoButton.addEventListener("click", generateVideo);
      videoDownloadButton.addEventListener("click", downloadCurrentVideo);
      clearGalleryButton.addEventListener("click", () => {
        localStorage.removeItem(HISTORY_KEY);
        renderGallery();
        setStatus("History cleared.");
      });
    </script>
  </body>
